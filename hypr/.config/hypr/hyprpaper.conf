# Hyprpaper config. Wallpapers live in ~/Pictures/wallpapers/.
# Apply with: pkill -x hyprpaper; hyprpaper &   (or log out and back in)

preload = /home/flaggzz/Pictures/wallpapers/ultrawide.png
preload = /home/flaggzz/Pictures/wallpapers/potrait.png

wallpaper {
    monitor = DP-5
    path = /home/flaggzz/Pictures/wallpapers/ultrawide.png
}

wallpaper {
    monitor = HDMI-A-2
    path = /home/flaggzz/Pictures/wallpapers/potrait.png
}

